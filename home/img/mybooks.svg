<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="My Books">
  <title>My Books</title>
  <defs>
    <!-- glossy 2000s orb -->
    <radialGradient id="orb" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#9fdcff"/>
      <stop offset=".45" stop-color="#3a9be8"/>
      <stop offset=".85" stop-color="#1450a8"/>
      <stop offset="1" stop-color="#0b2f6e"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset=".5" stop-color="#a9b6c8"/>
      <stop offset="1" stop-color="#5d6b80"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e4f2"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e4f2"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e2681b"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#06234f" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- metal rim + orb -->
  <g filter="url(#drop)">
    <circle cx="128" cy="124" r="112" fill="url(#rim)"/>
    <circle cx="128" cy="124" r="102" fill="url(#orb)"/>
    <circle cx="128" cy="124" r="102" fill="none" stroke="#0a2a60" stroke-opacity=".5" stroke-width="2"/>
  </g>

  <!-- open book -->
  <g filter="url(#bookShadow)">
    <!-- cover peeking under the pages -->
    <path d="M52 92 Q90 80 128 98 Q166 80 204 92 L204 176 Q166 166 128 184 Q90 166 52 176 Z" fill="url(#cover)"/>
    <!-- left page -->
    <path d="M60 86 Q96 74 128 92 L128 176 Q96 158 60 168 Z" fill="url(#pageL)"/>
    <!-- right page -->
    <path d="M196 86 Q160 74 128 92 L128 176 Q160 158 196 168 Z" fill="url(#pageR)"/>
    <!-- spine shadow -->
    <path d="M128 92 L128 176" stroke="#8aa0bd" stroke-width="2.5"/>
    <!-- text lines -->
    <g stroke="#9fb3cc" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M72 104 Q96 96 118 106"/>
      <path d="M72 118 Q96 110 118 120"/>
      <path d="M72 132 Q96 124 118 134"/>
      <path d="M72 146 Q90 140 106 146"/>
      <path d="M138 106 Q160 96 184 104"/>
      <path d="M138 120 Q160 110 184 118"/>
      <path d="M138 134 Q160 124 184 132"/>
      <path d="M150 146 Q166 140 184 146"/>
    </g>
    <!-- ribbon bookmark -->
    <path d="M164 84 L164 122 L172 114 L180 122 L180 80 Z" fill="#e8313a"/>
  </g>

  <!-- gloss highlight across the top -->
  <ellipse cx="128" cy="70" rx="80" ry="44" fill="url(#gloss)" opacity=".75"/>
</svg>
